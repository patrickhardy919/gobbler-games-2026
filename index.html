<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Great Gobbler Games 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#4A2209">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gobbler Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-sized column, chunky cards, fixed bottom tab bar. Rich chestnut-brown ground, orange/mustard/red accents. */
:root{
  --bg:#4A2209; --bg2:#6E3510; --surface:#6B3315; --surface2:#8A4620; --orange:#F26B1D; --orange-d:#A8430F;
  --red:#C2362B; --red-d:#7d1f18; --mustard:#FFC233; --mustard-d:#B8841A; --olive:#6E9A2F; --olive-d:#44661a;
  --cream:#FFF3DC; --muted:#F0D5AE; --ink:#2A1408; --deep:#341708;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(900px 420px at 50% -80px,var(--bg2),transparent) no-repeat,var(--bg);background-color:var(--bg);color:var(--cream);font:700 19px/1.35 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.shell{max-width:520px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.draft{background:var(--mustard);color:var(--ink);font-size:14px;font-weight:800;text-align:center;padding:6px 12px;letter-spacing:.04em;text-transform:uppercase}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{font:700 27px/1 var(--display);flex:1;min-width:0;color:var(--mustard)}
.logo small{display:block;margin-top:5px;font:700 13px var(--body);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.iconbtn{width:52px;height:52px;border-radius:16px;border:0;background:var(--surface);font-size:24px;display:grid;place-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:66px;padding:12px 20px;border:0;border-radius:22px;background:var(--orange);color:#fff;font:700 24px var(--display);box-shadow:0 7px 0 var(--orange-d);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--orange-d)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.mustard{background:var(--mustard);color:var(--ink);box-shadow:0 7px 0 var(--mustard-d)}
.btn.mustard:active{box-shadow:0 2px 0 var(--mustard-d)}
.btn.red{background:var(--red);box-shadow:0 7px 0 var(--red-d)}
.btn.red:active{box-shadow:0 2px 0 var(--red-d)}
.btn.olive{background:var(--olive);box-shadow:0 7px 0 var(--olive-d)}
.btn.ghost{background:var(--surface);box-shadow:0 7px 0 var(--deep);color:var(--cream)}
.btn.small{min-height:54px;font-size:20px;border-radius:18px}
:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.row>*{min-width:0}
.card{background:var(--surface);border-radius:26px;padding:18px}
.eyebrow{font:800 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h-sec{font-size:30px;margin:14px 0 0}
.sub{margin:2px 0 0;color:var(--muted);font-size:17px}
.muted{color:var(--muted)}
.big{font:700 44px var(--display)}
.ava{border-radius:24%;display:block;flex:none}
.spin{display:grid;place-items:center;padding:40px 0;font:700 26px var(--display);color:var(--muted)}

/* join */
.hero{text-align:center;padding:10px 0}
.hero h1{font-size:44px;color:var(--mustard);text-shadow:0 4px 0 var(--red)}
.hero p{margin:8px 0 0;font-size:21px}
.qrbox{background:#fff;border-radius:26px;padding:16px;display:grid;place-items:center;word-break:break-all;color:#222;font-size:14px}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.code{font:700 34px var(--display);letter-spacing:.12em;color:var(--mustard);text-align:center}
input[type=text],textarea{width:100%;min-height:68px;border-radius:20px;border:4px solid var(--surface2);background:var(--deep);color:var(--cream);font:700 28px var(--display);padding:8px 18px}
textarea{font:700 18px/1.35 var(--body);min-height:130px;padding:12px 14px;border-radius:16px;border-width:3px;resize:vertical}
input[type=text]::placeholder,textarea::placeholder{color:#b99370}
input.sm{min-height:58px;font-size:22px}
select{width:100%;min-height:58px;border-radius:16px;border:3px solid var(--surface2);background:var(--deep);color:var(--cream);font:700 20px var(--body);padding:8px 12px}
label.l{display:block;font:800 14px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{border:5px solid transparent;border-radius:26px;background:var(--surface);padding:6px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 17px/1.1 var(--display);color:var(--cream);text-align:center}
.pick svg{width:100%;height:auto}
.pick[aria-pressed=true]{border-color:var(--mustard);color:var(--mustard);background:var(--surface2)}
.preview{display:flex;align-items:center;gap:16px}
.preview svg{width:120px;height:120px}

/* home */
.rankcard{background:linear-gradient(135deg,var(--red),var(--orange));border-radius:28px;padding:16px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 0 var(--red-d);border:0;width:100%;text-align:left;color:#fff}
.rankcard .big{line-height:1}
.rankcard .dn{font:700 15px var(--display);margin-top:2px;opacity:.95}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{border:0;border-radius:16px;padding:10px 0;text-align:center;background:var(--surface);font:700 20px var(--display);color:var(--muted)}
.day small{display:block;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.day.on{background:var(--mustard);color:var(--ink)}
.day.past{background:var(--surface2);color:var(--cream)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:26px;padding:16px 14px 14px;min-height:178px;text-align:left;display:flex;flex-direction:column;gap:6px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.3);transition:transform .08s;position:relative}
.tile:active{transform:translateY(5px)}
.tile .art{font-size:48px;line-height:1}
.tile h3{font-size:23px}
.tile p{margin:0;font-size:15px;font-weight:700;opacity:.92}
.tile .tag{margin-top:auto;align-self:flex-start;font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:4px 9px;border-radius:99px}
.tile.dark{color:var(--ink)}
.tile.dark .tag{background:rgba(42,20,8,.18)}
.tile.done{filter:saturate(.35) brightness(.8)}
.tile.done .tag{background:var(--ink);color:var(--mustard)}
.c-or{background:var(--orange)} .c-re{background:var(--red)} .c-mu{background:var(--mustard)} .c-ol{background:var(--olive)} .c-pu{background:#7A4BB0} .c-bl{background:#2B6F8F}
.next{border:4px dashed var(--surface2);border-radius:26px;padding:18px;text-align:center;font:700 22px var(--display);color:var(--muted)}
.livebanner{width:100%;border:0;border-radius:24px;background:var(--mustard);color:var(--ink);padding:16px;font:700 24px var(--display);text-align:left;display:flex;gap:14px;align-items:center;box-shadow:0 7px 0 var(--mustard-d);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}

/* board */
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:10px;align-items:end;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;width:100%}
.pod .nm{font:700 18px var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font:700 20px var(--display);color:var(--mustard)}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:center;font:700 44px var(--display);color:var(--ink)}
.pod.p1 .blk{height:96px;background:var(--mustard)}
.pod.p2 .blk{height:70px;background:#d7d2c8}
.pod.p3 .blk{height:52px;background:#d98b4a}
.pod svg{width:100%;height:auto}
.gift{background:var(--mustard);color:var(--ink);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:800}
.gift b{font-family:var(--display);font-size:22px;display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--surface)}
.lrow.me{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-d)}
.lrow .rk{font:700 26px var(--display);width:40px;text-align:center;flex:none}
.lrow .nm{flex:1;min-width:0;font:700 22px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;font:700 13px var(--body);opacity:.8;margin-top:1px}
.lrow .pt{font:700 24px var(--display);font-variant-numeric:tabular-nums}

/* trivia */
.dots{display:flex;gap:8px}
.dots i{flex:1;height:10px;border-radius:9px;background:var(--surface2)}
.dots i.done{background:var(--mustard)}
.dots i.now{background:var(--orange)}
.timer{height:16px;background:var(--surface);border-radius:12px;overflow:hidden}
.timer b{display:block;height:100%;background:var(--olive);transition:width .1s linear,background .3s}
.qtext{font:700 32px/1.15 var(--display);padding:6px 2px}
.ans{display:flex;align-items:center;gap:14px;width:100%;min-height:78px;border:0;border-radius:22px;padding:12px 16px;text-align:left;font:800 23px/1.15 var(--body);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ans span.l{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font:700 24px var(--display)}
.ans:nth-child(1){background:var(--orange)} .ans:nth-child(2){background:var(--red)} .ans:nth-child(3){background:#2B6F8F} .ans:nth-child(4){background:var(--olive)}
.ans:disabled{cursor:default}
.ans.right{background:var(--mustard);color:var(--ink);transform:scale(1.02)}
.ans.wrong{opacity:.4}
.ans.mine{outline:5px solid #fff}
.ans.right span.l{background:rgba(42,20,8,.18)}
.feedback{border-radius:22px;padding:14px 16px;font:700 26px var(--display);text-align:center}
.feedback.good{background:var(--olive)}
.feedback.bad{background:var(--red)}
.score-burst{font:700 80px var(--display);color:var(--mustard);text-align:center;line-height:1}
.warn{background:var(--deep);border-radius:18px;padding:12px 16px;font-size:17px;color:var(--muted)}

/* clock games */
.clockbar{display:flex;justify-content:space-between;align-items:center;font:700 34px var(--display)}
.clockbar #clk{background:var(--deep);border-radius:16px;padding:2px 16px;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:0;border-radius:18px;min-height:64px;padding:8px 12px;background:var(--surface2);font:800 18px/1.1 var(--body);text-align:left;color:var(--cream);box-shadow:0 5px 0 var(--deep)}
.chip:disabled{opacity:.35;box-shadow:none}
.chip.g{background:var(--olive);text-align:center}
.chip.sm{min-height:48px;padding:6px 12px;font-size:16px}
.qa{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface);font-size:18px}
.qa b{font-family:var(--display);font-size:22px}
.qa b.y{color:#bff08a} .qa b.n{color:#ff9b8f}
.wordrow{display:flex;align-items:center;gap:12px;border-radius:16px;overflow:hidden;position:relative;background:var(--deep);padding:10px 14px;font:700 22px var(--display)}
.wordrow i{position:absolute;inset:0 auto 0 0;opacity:.85}
.wordrow span,.wordrow em{position:relative;font-style:normal}
.wordrow span{flex:1}
.scr{font:700 52px var(--display);letter-spacing:.18em;text-align:center;color:var(--mustard);padding:6px 0;word-break:break-all}

/* picks */
.match{background:var(--surface);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs>span{font:700 18px var(--display);color:var(--muted)}
.team{min-height:74px;border-radius:20px;border:4px solid transparent;background:var(--surface2);font:700 22px/1.05 var(--display);padding:8px;color:var(--cream);text-align:center;word-break:break-word}
.team[aria-pressed=true]{background:var(--mustard);color:var(--ink);border-color:#fff}
.team.win{outline:4px solid var(--olive)}
.team.lose{opacity:.5}
.rtag{font:800 14px var(--body);letter-spacing:.06em;text-transform:uppercase;text-align:center}

/* chat */
.chatlist{display:flex;flex-direction:column;gap:10px;max-height:36vh;min-height:150px;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.msg .bub{background:var(--surface);border-radius:20px 20px 20px 6px;padding:8px 14px;min-width:0;overflow-wrap:anywhere}
.msg .who{font:700 14px var(--display);color:var(--mustard);display:flex;gap:8px;align-items:center}
.msg .who button{border:0;background:var(--red);border-radius:10px;padding:0 8px;font-size:14px}
.msg .tx{font-size:20px;line-height:1.25}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--orange);border-radius:20px 20px 6px 20px}
.msg.me .who{color:#fff;justify-content:flex-end}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:var(--mustard);color:var(--ink);border-radius:16px;font-size:17px;text-align:center}
.taunts{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.taunts .chip{flex:none;min-height:48px;white-space:nowrap;font-size:16px}
.badge{position:absolute;top:2px;right:calc(50% - 30px);min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font:700 14px/24px var(--display);text-align:center;padding:0 6px}

/* live (player) + tv */
.votegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vote{border:5px solid transparent;border-radius:22px;background:var(--surface);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 16px/1.1 var(--display);color:var(--cream);text-align:center;min-width:0}
.vote svg{width:100%;height:auto}
.vote span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote[aria-pressed=true]{border-color:var(--mustard);background:var(--surface2)}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
.tvfull{position:fixed;inset:0;z-index:30;background:radial-gradient(1200px 600px at 50% -100px,#6E3510,transparent) no-repeat,#2c1206;overflow:auto;padding:max(18px,3vw);display:flex;flex-direction:column;gap:2vw}
.tvfull h1{font-size:clamp(28px,5vw,64px);color:var(--mustard);text-shadow:0 4px 0 var(--red)}
.tvq{font:700 clamp(30px,5.4vw,76px)/1.1 var(--display);text-align:center}
.tvbars{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.tvbar{position:relative;border-radius:22px;overflow:hidden;background:#3f1d0a;min-height:clamp(70px,12vw,150px);display:flex;align-items:center;padding:0 2vw;font:800 clamp(20px,3.6vw,48px) var(--body);gap:1.4vw}
.tvbar i{position:absolute;inset:0 auto 0 0;opacity:.9;transition:width .5s}
.tvbar span,.tvbar b{position:relative}
.tvbar span{flex:1;min-width:0;overflow-wrap:anywhere}
.tvbar b{font-family:var(--display);font-size:1.3em}
.tvbar.right{outline:6px solid var(--mustard)}
.tvmeta{display:flex;justify-content:space-between;font:700 clamp(18px,2.6vw,34px) var(--display);color:var(--muted)}
.tvboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.4vw}
.tvrow{display:flex;align-items:center;gap:14px;background:#4d2410;border-radius:22px;padding:10px 16px;font:700 clamp(20px,2.8vw,38px) var(--display)}
.tvrow b{margin-left:auto;color:var(--mustard)}
.tvrow .rk{width:1.4em;text-align:center;color:var(--mustard)}
.tvwin{display:flex;flex-wrap:wrap;gap:2vw;justify-content:center}
.tvwin div{display:flex;flex-direction:column;align-items:center;font:700 clamp(24px,4vw,56px) var(--display);gap:8px}

/* admin */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 14px;border-radius:18px;background:var(--surface2);border:0;width:100%;text-align:left;font:700 20px var(--body)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto;width:100%}
.pad button{min-height:78px;border-radius:22px;border:0;background:var(--surface2);font:700 38px var(--display);box-shadow:0 6px 0 var(--deep)}
.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.pin{display:flex;gap:14px;justify-content:center}
.pin i{width:26px;height:26px;border-radius:50%;border:4px solid var(--mustard)}
.pin i.f{background:var(--mustard)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:var(--surface2);flex-wrap:wrap}
.rrow>div:first-child{flex:1;min-width:140px;font:700 18px/1.15 var(--body)}
.rrow small{display:block;color:var(--muted);font-size:14px}
.st{font:800 12px var(--body);text-transform:uppercase;letter-spacing:.06em;border-radius:99px;padding:3px 9px;background:var(--deep);color:var(--muted)}
.st.ok{background:var(--olive);color:#fff}
.st.pl{background:var(--mustard);color:var(--ink)}
.help{font-size:15px;color:var(--muted);margin:4px 0 0;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:64px;border:0;border-radius:14px;min-height:50px;background:var(--surface2);font:700 17px var(--display);padding:6px 10px}
.seg button[aria-pressed=true]{background:var(--mustard);color:var(--ink)}

/* tabs, toast, confetti */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--deep);border-top:3px solid var(--surface);display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
.tabs>div{display:flex;gap:6px;width:100%;max-width:520px}
.tab{flex:1;border:0;background:transparent;border-radius:18px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:700 15px var(--display);color:var(--muted);position:relative}
.tab b{font-size:26px;line-height:1.1}
.tab[aria-current=page]{background:var(--surface2);color:var(--mustard)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--mustard);color:var(--ink);font:700 22px var(--display);padding:14px 22px;border-radius:20px;z-index:60;max-width:92vw;text-align:center;transition:transform .25s;box-shadow:0 6px 0 var(--mustard-d)}
#toast.show{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wag{animation:wag .6s ease-in-out 2}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="draft" id="draftbar" hidden>Demo mode · sample family · nothing is saved to a Google Sheet</div>
<div class="shell" id="shell">
  <header class="top">
    <div class="logo">The Great Gobbler Games<small>2026 · Wed – Fri Tournament</small></div>
    <button class="iconbtn" id="soundbtn" data-act="sound" aria-label="Sound on" title="Sound">🔊</button>
  </header>
  <main id="view" class="stack"></main>
</div>
<div id="tvlayer" class="tvfull" hidden></div>
<nav class="tabs" id="tabs" hidden><div>

/* Great Gobbler Games engine.
   All rules, scoring and chat live here. The same code runs in the Google Apps Script backend
   (reading and writing the Google Sheet) and in the in-browser demo (in-memory tables).
   db interface: read(table) -> array of row objects (fresh copy), add(table,row), save(table,rows). */
function createEngine(db, opt) {
  opt = opt || {};
  var now = function () { return Date.now(); };
  var rid = function (p) { return p + Math.random().toString(36).slice(2, 8) + (now() % 1e6).toString(36); };

  var pinOk = function (p) { return String(p) === String((opt.pin && opt.pin()) || '5062'); };
  var clean = function (s, n) { return String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, ' ').trim().slice(0, n || 200); };

  /* ---------- settings ---------- */
  function setting(k, def) {
    var r = db.read('settings').filter(function (x) { return x.key === k; })[0];
    if (!r || r.value === '' || r.value == null) return def;
    try { return JSON.parse(r.value); } catch (e) { return r.value; }
  }
  function setSetting(k, v) {
    var rows = db.read('settings'), s = JSON.stringify(v), r = rows.filter(function (x) { return x.key === k; })[0];
    if (r) r.value = s; else rows.push({ key: k, value: s });

  }
  var curDay = function () { return Number(setting('day', 1)) || 1; };

  /* ---------- scores (the ledger is the single source of truth) ---------- */
  function board() {
    var t = {};
    db.read('ledger').forEach(function (r) { t[r.pid] = (t[r.pid] || 0) + (Number(r.pts) || 0); });
    return db.read('players').map(function (p, i) { return { id: p.id, name: p.name, av: Number(p.av) || 0, score: t[p.id] || 0, o: i }; });
  }
  var ranked = function (b) { return b.slice().sort(function (x, y) { return y.score - x.score || x.o - y.o; }); };
  var rankIn = function (b, pid) { return ranked(b).map(function (p) { return p.id; }).indexOf(pid) + 1; };
  function addPts(pid, gid, pts, note) {
    pts = Math.round(pts); if (!pts) return;
    var before = rankIn(board(), pid);
    db.add('ledger', { ts: now(), pid: pid, gid: gid, pts: pts, note: note || '' });
    var b = board(), after = rankIn(b, pid);
    if (after > 0 && after <= 3 && before > 3) {
      var p = b.filter(function (x) { return x.id === pid; })[0];
      sys(p.name + ' just landed at #' + after + ' on the leaderboard! 🦃');
    }
  }

  /* ---------- chat ---------- */
  function post(row) {
    var c = db.read('chat'), last = c.length ? Number(c[c.length - 1].ts) : 0;
    var ts = Math.max(now(), last + 1);
    db.add('chat', Object.assign({ id: rid('c'), pid: '', name: '', av: 0, text: '', kind: 'user' }, row, { ts: ts }));
  }
  function sys(text) { post({ kind: 'system', name: 'Gobbler HQ', text: text }); }

  /* ---------- lookups ---------- */
  var gameOf = function (id) { return db.read('games').filter(function (g) { return g.id === id; })[0]; };
  var meOf = function (pid) { return db.read('players').filter(function (p) { return p.id === pid; })[0]; };
  var playOf = function (pid, gid) { return db.read('plays').filter(function (p) { return p.pid === pid && p.gid === gid; })[0]; };
  function putPlay(p) {
    var rows = db.read('plays'), i = -1;
    rows.forEach(function (r, k) { if (r.pid === p.pid && r.gid === p.gid) i = k; });
    if (i < 0) rows.push(p); else rows[i] = p;

  function livePub(pid) {
    var L = setting('live', null); if (!L) return null;
    var g = gameOf(L.gid); if (!g) return null;
    var c = g.cfg || {};

      total: L.kind === 'race' ? (c.questions || []).length : (c.prompts || []).length,
      answered: Object.keys(L.answers || {}).length, mine: (L.answers && L.answers[pid]) ? L.answers[pid].ch : null, last: L.last || null };
    if (L.qi >= 0) {

      var o = { id: g.id, day: Number(g.day), type: g.type, title: g.title, emoji: g.emoji, blurb: g.blurb, status: p ? p.status : 'new', pts: p ? Number(p.pts) || 0 : 0 };
      if (g.type === 'picks') o.n = ((g.cfg && g.cfg.matches) || []).length;

    if (host) { out.code = setting('code', 'GOBBLE26'); out.plays = db.read('plays').map(function (p) { return { pid: p.pid, gid: p.gid, status: p.status, pts: p.pts }; }); }
    return out;
  }

    state: function (r) { return state(r.pid, false); },
    sync: function (r) { return { ok: true, state: state(r.pid, false), chat: chatSince(r.since) }; },
    tv: function () {
      var b = ranked(board()).map(function (p) { return { id: p.id, name: p.name, av: p.av, score: p.score }; });

    join: function (r) {
      var code = String(setting('code', 'GOBBLE26')).toUpperCase();
      if (code && clean(r.code, 20).toUpperCase() !== code) return err('That family code is not right.');
      var name = clean(r.name, 14); if (!name) return err('Enter a screen name.');
      var ps = db.read('players');
      if (ps.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) return err('That screen name is taken. Try another.');
      var id = rid('p');

    },
    profile: function (r) {
      var rows = db.read('players'), p = rows.filter(function (x) { return x.id === r.pid; })[0]; if (!p) return err('Join first.');
      var name = clean(r.name, 14) || p.name;
      if (rows.some(function (x) { return x.id !== p.id && x.name.toLowerCase() === name.toLowerCase(); })) return err('That screen name is taken.');
      p.name = name; p.av = Number(r.av) || 0; db.save('players', rows); return { ok: true };
    },
    start: function (r) {
      var g = gameOf(r.gid); if (!g) return err('Game not found.');
      if (!meOf(r.pid)) return err('Join first.');
      if (Number(g.day) > curDay()) return err('This game is not open yet.');
      if (SOLO.indexOf(g.type) < 0) return err('This is not a solo game.');
      if (playOf(r.pid, g.id)) return err('You already played this one. Ask the host to allow a replay.');
      var c = g.cfg, st = {}, out = { ok: true, type: g.type, title: g.title, emoji: g.emoji };
      if (g.type === 'trivia') {
        st.perm = c.questions.map(function (q) { return shuf(q.a.map(function (_, i) { return i; })); });
        out.questions = c.questions.map(function (q, i) { return { q: q.q, a: st.perm[i].map(function (k) { return q.a[k]; }) }; });
        out.seconds = 15;
      } else if (g.type === 'twenty') {
        st = { asked: [], wrong: 0, tried: [] };
        out.questions = c.qa.map(function (x) { return x.q; }); out.choices = shuf(c.choices); out.seconds = c.seconds || 150;
      } else if (g.type === 'scramble') {
        st = { i: 0, ok: 0, words: c.words.map(function (w) {
          var a = w.w.split(''), s = w.w, n = 0; while (s === w.w && n++ < 30) { a = shuf(a); s = a.join(''); } return { scr: s.toUpperCase(), hint: w.hint || '' }; }) };
        out.words = st.words; out.seconds = c.seconds || 60;

        st = { guesses: [] }; out.seconds = c.seconds || 150;

      db.add('plays', { pid: r.pid, gid: g.id, ts: now(), status: 'started', pts: 0, st: st });

    },
    answer: function (r) {
      var g = gameOf(r.gid), p = playOf(r.pid, r.gid); if (!g || !p || p.status !== 'started' || g.type !== 'trivia') return err('No game in progress.');
      var st = p.st, qi = Number(r.qi), q = g.cfg.questions[qi]; if (!q) return err('Bad question.');

      var choice = Number(r.choice), orig = choice >= 0 ? st.perm[qi][choice] : -1, ok = orig === 0;
      var tl = Math.max(0, Math.min(15, Number(r.tleft) || 0)), pts = ok ? 100 + Math.round(tl / 15 * 50) : 0;
      st.ans[qi] = choice; p.pts = (Number(p.pts) || 0) + pts;
      var done = Object.keys(st.ans).length >= g.cfg.questions.length; if (done) p.status = 'done';
      putPlay(p); if (pts) addPts(r.pid, g.id, pts, g.title + ' Q' + (qi + 1));

    twentyAsk: function (r) {

/* ---------- Sounds (synthesized) ---------- */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
/* Real recordings win: drop gobble.mp3 and/or bark.mp3 next to index.html and they are used instead of the synthesized sounds. */
const REC={};
async function loadRec(n){for(const ext of ['mp3','m4a','wav','ogg']){try{const r=await fetch(n+'.'+ext);if(!r.ok)continue;const b=await r.arrayBuffer(),c=ac();if(!c)return;REC[n]=await c.decodeAudioData(b);return}catch(e){}}}
function playRec(n,vol,t0){const c=ac(),s=c.createBufferSource(),g=c.createGain();s.buffer=REC[n];g.gain.value=vol;s.connect(g);g.connect(c.destination);s.start(c.currentTime+(t0||0))}
function noiseBuf(c,sec){const b=c.createBuffer(1,Math.ceil(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
/* One dachshund yap: sharp noisy attack, pitch pops up then falls, about a tenth of a second. p = pitch multiplier. */
function yap(c,t,vol,p){
  const o=c.createOscillator(),o2=c.createOscillator(),sub=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth';o2.type='square';sub.gain.value=.45;
  const f0=640*p;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*1.55,t+.03);o.frequency.exponentialRampToValueAtTime(f0*.8,t+.12);
  o2.frequency.setValueAtTime(f0*.5,t);o2.frequency.exponentialRampToValueAtTime(f0*.78,t+.03);o2.frequency.exponentialRampToValueAtTime(f0*.4,t+.12);
  f.type='bandpass';f.frequency.setValueAtTime(1600,t);f.frequency.exponentialRampToValueAtTime(950,t+.12);f.Q.value=1.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(f);o2.connect(sub);sub.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o2.start(t);o.stop(t+.17);o2.stop(t+.17);
  const n=c.createBufferSource(),nf=c.createBiquadFilter(),ng=c.createGain();n.buffer=noiseBuf(c,.06);nf.type='highpass';nf.frequency.value=1800;
  ng.gain.setValueAtTime(vol*.55,t);ng.gain.exponentialRampToValueAtTime(.001,t+.05);n.connect(nf);nf.connect(ng);ng.connect(c.destination);n.start(t);
}
function bark(t0=0,vol=.5){
  if(!S.sound)return;const c=ac();if(!c)return;
  if(REC.bark){playRec('bark',Math.min(1,vol*1.6),t0);return}
  yap(c,c.currentTime+t0,vol,1);
}
function barks(n=2){for(let i=0;i<n;i++)bark(i*.2)}
/* Tap a wiener dog: yap, yap-yap */
function wiener(){
  if(!S.sound)return;const c=ac();if(!c)return;
  if(REC.bark){playRec('bark',.9);return}
  const t=c.currentTime;[[0,1],[.2,1.14],[.35,.94]].forEach(x=>yap(c,t+x[0],.7,x[1]));
}
/* A tom turkey's gobble: one big "gob" then a fast, rattly "obble-obble-obble", throaty and nasal (a hen only clucks). */
let lastGob=0;
function gobble(){
  if(!S.sound)return;const c=ac();if(!c)return;
  if(Date.now()-lastGob<1800)return;lastGob=Date.now();
  if(REC.gobble){playRec('gobble',1);return}
  const t=c.currentTime,N=10,gap=.105,master=c.createGain();master.gain.value=.95;master.connect(c.destination);
  for(let k=0;k<N;k++){
    const first=k===0,s=t+(first?0:.17+(k-1)*gap),len=first?.19:.12,base=(first?470:690)-k*14;
    const o=c.createOscillator(),vib=c.createOscillator(),vg=c.createGain(),f1=c.createBiquadFilter(),f2=c.createBiquadFilter(),g=c.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(first?base:base*1.15,s);o.frequency.exponentialRampToValueAtTime(first?base*1.55:base*.6,s+len*.8);
    vib.frequency.value=52;vg.gain.value=base*.1;vib.connect(vg);vg.connect(o.frequency);
    f1.type='bandpass';f1.frequency.value=1100;f1.Q.value=2.4;
    f2.type='peaking';f2.frequency.value=2500;f2.gain.value=7;
    const amp=(first?.9:.75)*(1-k*.04);
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(amp,s+.012);g.gain.exponentialRampToValueAtTime(.001,s+len);
    o.connect(f1);f1.connect(f2);f2.connect(g);g.connect(master);o.start(s);vib.start(s);o.stop(s+len+.02);vib.stop(s+len+.02);
  }
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.ava'))wiener()});

function boop(){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(110,t+.35);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.4);
}

const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(big){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=['#F26B1D','#FFC233','#C2362B','#6E9A2F','#FFF3DC','#7A4BB0'];
  const n=reduce?30:(big?220:110);
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20*devicePixelRatio-Math.random()*cv.height*.4,vx:(Math.random()-.5)*5*devicePixelRatio,vy:(2+Math.random()*5)*devicePixelRatio,w:(8+Math.random()*10)*devicePixelRatio,h:(5+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06*devicePixelRatio;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+40);
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}
}

   <div class="podium">${pod(top[1],2)}${pod(top[0],1)}${pod(top[2],3)}</div>
   <div class="stack" style="gap:10px">${rest.map(row).join('')}</div>

chat(){

   <div class="taunts" aria-label="Quick taunts">${taunts.map(t=>`<button class="chip" data-act="taunt" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>

},
trivia(){
  const T=S.T,n=T.qs?T.qs.length:0;

   <div class="hero"><div style="font-size:84px">${esc(T.g.emoji)}</div><h1 style="font-size:40px">${esc(T.g.title)}</h1><p>Answer fast for bonus points. Each right answer is 100 points, plus up to 50 for speed.</p></div>

   <div class="dots">${T.qs.map((_,k)=>`<i class="${k<T.i?'done':k===T.i?'now':''}"></i>`).join('')}</div>

   <div class="qtext">${esc(q.q)}</div>
   <div class="stack" style="gap:12px">${q.a.map((a,k)=>`<button class="ans ${pk?(k===T.c?'right':'wrong'):''} ${pk&&k===T.picked&&k!==T.c?'mine':''}" data-act="ans" data-k="${k}" ${pk||T.busy?'disabled':''}><span class="l">${'ABCD'[k]}</span>${esc(a)}</button>`).join('')}</div>

},
twenty(){
  const W=S.W;
  if(W.stage==='intro')return `<div class="hero"><div style="font-size:84px">🕵️</div><h1 style="font-size:40px">${esc(W.g.title)}</h1><p>I'm thinking of something. Ask yes-or-no questions, then make your guess. You have ${fmt(W.seconds||150)}.</p></div>
   <div class="warn">Fewer questions and fewer wrong guesses score more. One try only.</div>
   <button class="btn mustard" data-act="startSolo" ${S.busy?'disabled':''}>Start the clock</button><button class="btn ghost small" data-act="tab" data-v="home">Back to games</button>`;
  if(W.stage==='end')return `<div class="hero"><div class="eyebrow">${W.win?'You got it!':'Out of time'}</div><div class="score-burst pop">+${W.pts}</div><p>${W.secret?`The answer was ${esc(W.secret)}.`:''}</p></div>
   <button class="btn mustard" data-act="tab" data-v="board">See the leaderboard</button><button class="btn ghost" data-act="tab" data-v="home">More games</button>`;

   ${W.asked.length?`<div class="stack" style="gap:8px">${W.asked.slice().reverse().map(a=>`<div class="qa"><span>${esc(a.q)}</span><b class="${a.a==='Yes'?'y':'n'}">${a.a}</b></div>`).join('')}</div>`:''}
   ${W.guess?`<div class="eyebrow">What is it? Wrong guesses cost 40 points.</div><div class="chips">${W.choices.map(g=>`<button class="chip g" data-act="tguess" data-g="${esc(g)}" ${W.tried.includes(g)||S.busy?'disabled':''}>${esc(g)}</button>`).join('')}</div><button class="btn ghost small" data-act="tback">Back to questions</button>`
   :`<div class="eyebrow">Ask a question</div><div class="chips">${W.qs.map((q,i)=>`<button class="chip" data-act="task" data-i="${i}" ${asked.includes(i)||W.asked.length>=20||S.busy?'disabled':''}>${esc(q)}</button>`).join('')}</div><button class="btn mustard" data-act="tmake">I know it! Make a guess</button>`}`;
},
scramble(){
  const D=S.SD;
  if(D.stage==='intro')return `<div class="hero"><div style="font-size:84px">🔤</div><h1 style="font-size:40px">${esc(D.g.title)}</h1><p>Unscramble the words before the clock runs out.</p></div>
   <div class="warn">Each word is 50 points. Leftover seconds add bonus points. One try only.</div>
   <button class="btn mustard" data-act="startSolo" ${S.busy?'disabled':''}>Start the clock</button><button class="btn ghost small" data-act="tab" data-v="home">Back to games</button>`;
  if(D.stage==='end')return `<div class="hero"><div class="eyebrow">${D.ok} unscrambled</div><div class="score-burst pop">+${D.pts}</div></div>
   <button class="btn mustard" data-act="tab" data-v="board">See the leaderboard</button><button class="btn ghost" data-act="tab" data-v="home">More games</button>`;

   <div class="scr" aria-label="Scrambled word">${esc(w.scr)}</div><div class="sub" style="text-align:center">Hint: ${esc(w.hint)}</div>
   <input type="text" class="sm" id="sdin" placeholder="Type the word" autocomplete="off" autocapitalize="off" aria-label="Your answer">
   <button class="btn" data-act="sdGo" ${S.busy?'disabled':''}>Check</button><button class="btn ghost small" data-act="sdSkip" ${S.busy?'disabled':''}>Skip this word</button>`;
},
warm(){
  const U=S.WU;
  if(U.stage==='intro')return `<div class="hero"><div style="font-size:84px">🔥</div><h1 style="font-size:40px">${esc(U.g.title)}</h1><p>I'm thinking of a secret word. Type any word and I'll show how close it is. Rank 1 is the secret word.</p></div>
   <div class="warn">Fewer guesses score more. One try only.</div>
   <button class="btn mustard" data-act="startSolo" ${S.busy?'disabled':''}>Start the clock</button><button class="btn ghost small" data-act="tab" data-v="home">Back to games</button>`;
  if(U.stage==='end')return `<div class="hero"><div class="eyebrow">${U.win?'You found it!':'Out of time'}</div><div class="score-burst pop">+${U.pts}</div><p>${U.secret?`The word was ${esc(U.secret)}.`:''}</p></div>
   <button class="btn mustard" data-act="tab" data-v="board">See the leaderboard</button><button class="btn ghost" data-act="tab" data-v="home">More games</button>`;
  const best=[...U.guesses].sort((a,b)=>a.rank-b.rank);
  const row=g=>{const pct=Math.max(6,100-Math.min(100,g.rank<=60?g.rank*1.6:96));const col=g.rank<=10?'#6E9A2F':g.rank<=30?'#C9A21E':g.rank<=80?'#F26B1D':'#C2362B';return `<div class="wordrow"><i style="width:${pct}%;background:${col}"></i><span>${esc(g.w)}</span><em>${g.rank>=500?'500+':g.rank}</em></div>`};
  return `<div class="clockbar"><span>${U.guesses.length} guesses</span><span id="clk">${fmt(U.seconds)}</span></div>
   <input type="text" class="sm" id="wuin" placeholder="Type a word" autocomplete="off" autocapitalize="off" aria-label="Your guess">

   ${U.last?`<div class="eyebrow">Latest guess</div>${row(U.last)}`:''}

},
picks(){
  const K=S.PK;if(!K)return '<div class="spin">Loading…</div>';
  const locked=K.locked,ch=locked?K.mine:K.choice,ready=K.matches.every(m=>ch[m.id]);

   ${K.matches.map(m=>{const mine=ch[m.id],res=m.w;
     const tb=(side,name)=>`<button class="team ${res?(res===side?'win':'lose'):''}" data-act="pick" data-m="${m.id}" data-s="${side}" aria-pressed="${mine===side}" ${locked?'disabled':''}>${esc(name)}</button>`;
     return `<div class="match"><div class="vs">${tb('a',m.a)}<span>vs</span>${tb('b',m.b)}</div>${res&&locked?`<div class="rtag" style="color:${mine===res?'#bff08a':'#ff9b8f'}">${mine===res?'Right! +50':'Missed it'}</div>`:res?'<div class="rtag muted">Result is in</div>':''}</div>`}).join('')}
   ${locked?'':`<button class="btn mustard" data-act="lockPicks" ${ready&&!S.busy?'':'disabled'}>${ready?'Lock in my picks':'Pick every game to lock in'}</button>`}
   <button class="btn ghost small" data-act="tab" data-v="home">Back to games</button>`;
},
info(){
  const g=S.cur;
  return `<div class="hero"><div style="font-size:84px">${esc(g.emoji)}</div><h1 style="font-size:40px">${esc(g.title)}</h1><p>${esc(g.blurb)}</p></div>

live(){return '<div id="livebox" class="stack"></div>'},

};

 trivia:{ph:"Which pie is most popular?|Pumpkin|Cherry|Lemon|Pecan\nWhat ship carried the Pilgrims?|Mayflower|Santa Maria|Nautilus|Endeavour",h:'One question per line: Question | Correct answer | Wrong | Wrong | Wrong. Answers are shuffled for players.'},
 race:{ph:"Which pie is most popular?|Pumpkin|Cherry|Lemon|Pecan",h:'Same format as trivia. Everyone answers on their phones while the TV shows the results.'},

      ${(g.type==='race'||g.type==='vote')?`<button class="chip sm" data-act="liveStart" data-id="${g.id}">Start on TV</button>`:''}

      <div class="row"><button class="btn small ghost" data-act="openTv">Open TV screen here</button><button class="btn small red" data-act="liveEnd">End game</button></div></div>`:''}
   <div class="card stack"><h3>Add a game</h3>
     <div><label class="l">Which day?</label><div class="seg">${DAYS.map((x,i)=>`<button data-act="ngDay" data-d="${i+1}" aria-pressed="${ng.day===i+1}">${x}</button>`).join('')}</div></div>

   <div class="card stack"><h3>Players (${players.length})</h3><p class="help">Remove a player and their points, plays and picks are deleted too. They can join again with a new name.</p>

/* ---------- Rendering ---------- */
function render(){
  clearTimers();
  const v=S.view;
  $('#shell').hidden=(v==='tv');$('#tvlayer').hidden=(v!=='tv');
  if(v==='tv'){$('#tabs').hidden=true;S.tvSig='';drawTv();return}
  $('#view').innerHTML=V[v]();
  $('#tabs').hidden=(v==='join'||v==='boot');
  const tabOf={board:'board',admin:'admin',chat:'chat'}[v]||'home';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tabOf?'page':'false'));
  if(v==='trivia'&&S.T.stage==='q'&&S.T.picked==null&&!S.T.busy)startTimer();
  if(v==='twenty'&&S.W.stage==='play')startClock(S.W,()=>endByClock('twenty'));
  if(v==='scramble'&&S.SD.stage==='play'){startClock(S.SD,()=>endByClock('scramble'));const i=$('#sdin');if(i)i.focus()}
  if(v==='warm'&&S.WU.stage==='play'){startClock(S.WU,()=>endByClock('warm'));const i=$('#wuin');if(i)i.focus()}
  if(v==='chat')drawChat(false);
  if(v==='live')renderLiveEnter(S.st.live,'');
  if(v==='admin'&&S.unlocked)drawQr();
}
function go(v,p){Object.assign(S,p||{});S.view=v;render();window.scrollTo(0,0)}
function joinUrl(){return location.href.split('#')[0].split('?')[0]+'?code='+encodeURIComponent((S.hs&&S.hs.code)||'')}

function drawTv(){
  const t=S.tv,box=$('#tvlayer');if(!box)return;
  if(!t){box.innerHTML='<h1>The Great Gobbler Games 2026</h1><div class="tvq">Connecting…</div>';return}
  const L=t.live,sig=JSON.stringify([t.players.map(p=>[p.id,p.score]),L&&[L.gid,L.phase,L.qi,L.answered,L.last]]);
  if(sig===S.tvSig)return;S.tvSig=sig;
  const colors=['#F26B1D','#C2362B','#2B6F8F','#6E9A2F'];
  let body='';
  const board=t.players.slice(0,8).map((p,i)=>`<div class="tvrow"><span class="rk">${i+1}</span>${dog(p.av,56)}<span>${esc(p.name)}</span><b>${p.score}</b></div>`).join('');
  if(!L){body=`<div class="tvq">Leaderboard</div><div class="tvboard">${board}</div><div class="tvmeta"><span>Day ${t.day} of 3</span><span>New games drop every morning</span></div>`}
  else if(L.phase==='lobby'){body=`<div class="tvq">${esc(L.emoji)} ${esc(L.title)}</div><div class="tvq" style="color:var(--mustard)">Open the app on your phone and tap the live banner!</div><div class="tvboard">${board}</div>`}
  else if(L.kind==='race'){
    const rev=L.phase==='reveal',mx=Math.max(1,...(rev?L.last.counts:[0]));
    body=`<div class="tvmeta"><span>${esc(L.title)} · Question ${L.qi+1} of ${L.total}</span><span>${L.answered} answered</span></div><div class="tvq">${esc(L.q)}</div>
    <div class="tvbars">${L.choices.map((c,k)=>`<div class="tvbar ${rev&&L.last.c===k?'right':''}"><i style="width:${rev?L.last.counts[k]/mx*100:0}%;background:${colors[k]}"></i><span>${'ABCD'[k]}. ${esc(c)}</span>${rev?`<b>${L.last.counts[k]}</b>`:''}</div>`).join('')}</div>${rev?`<div class="tvboard">${board}</div>`:''}`;
  } else {
    const rev=L.phase==='reveal';
    const win=rev?(L.last.winners||[]).map(id=>t.players.find(p=>p.id===id)).filter(Boolean):[];
    body=`<div class="tvmeta"><span>${esc(L.title)} · ${L.qi+1} of ${L.total}</span><span>${L.answered} voted</span></div><div class="tvq">${esc(L.q)}</div>
    ${rev?(win.length?`<div class="tvwin">${win.map(p=>`<div>${dog(p.av,160)}${esc(p.name)} <span style="color:var(--mustard)">${L.last.tally[p.id]} votes</span></div>`).join('')}</div>`:'<div class="tvq">No votes yet!</div>'):'<div class="tvq" style="color:var(--mustard)">Vote on your phone!</div>'}`;
  }
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><h1>The Great Gobbler Games</h1><div id="tvqr" style="background:#fff;padding:8px;border-radius:14px;flex:none"></div></div>${body}<button class="chip sm" style="align-self:flex-start;opacity:.5" data-act="exitTv">Exit TV screen</button>`;
  qrFor($('#tvqr'),84);
}

/* live (player) */
function renderLiveEnter(L,was){
  const box=$('#livebox');if(!box)return;
  if(!L){box.innerHTML=`<div class="hero"><h1 style="font-size:36px">That game just ended</h1></div><button class="btn mustard" data-act="tab" data-v="board">See the leaderboard</button>`;return}
  const mine=L.mine;let h=`<div class="eyebrow">${esc(L.emoji)} ${esc(L.title)} · ${L.qi>=0?'Round '+(L.qi+1)+' of '+L.total:'Lobby'}</div>`;
  if(L.phase==='lobby')h+=`<div class="hero"><div style="font-size:84px">${esc(L.emoji)}</div><h1 style="font-size:36px">Get ready!</h1><p>Watch the TV. The host will start round 1.</p></div>`;
  else if(L.kind==='race'){
    const rev=L.phase==='reveal';
    h+=`<div class="qtext">${esc(L.q)}</div><div class="stack" style="gap:12px">${L.choices.map((c,k)=>`<button class="ans ${rev?(k===L.last.c?'right':'wrong'):''} ${mine===k?'mine':''}" data-act="liveAns" data-k="${k}" ${mine!=null||rev?'disabled':''}><span class="l">${'ABCD'[k]}</span>${esc(c)}</button>`).join('')}</div>`;
    if(!rev&&mine!=null)h+='<div class="feedback good">Locked in! Watch the TV.</div>';
    if(rev){const ok=mine===L.last.c;h+=`<div class="feedback ${ok?'good pop':'bad pop'}">${mine==null?'No answer this round':ok?'Correct!':'Not quite!'}</div>`;
      if(ok&&was&&was.indexOf('"open"')>=0){setTimeout(()=>{gobble();confetti(false)},50)}}
  } else {
    const rev=L.phase==='reveal';
    h+=`<div class="qtext">${esc(L.q)}</div>`;
    if(!rev&&mine==null)h+=`<div class="votegrid">${S.st.players.map(p=>`<button class="vote" data-act="liveVote" data-p="${p.id}">${dog(p.av,80)}<span>${esc(p.name)}</span></button>`).join('')}</div>`;
    else if(!rev)h+='<div class="feedback good">Vote locked in! Watch the TV.</div>';
    else{const w=(L.last.winners||[]).map(id=>S.st.players.find(p=>p.id===id)).filter(Boolean);h+=`<div class="feedback good pop">${w.length?'Winner: '+w.map(p=>esc(p.name)).join(', '):'No votes'}</div>`;
      if(w.some(p=>p.id===mine)||(mine&&(L.last.winners||[]).indexOf(mine)>=0))h+='<div class="feedback good">You voted with the family. +50!</div>'}
  }
  h+=`<button class="btn ghost small" data-act="tab" data-v="home">Back to games</button>`;
  box.innerHTML=h;
}

function startTimer(){
  const T=S.T;
  timers.push(setInterval(()=>{
    T.t=Math.max(0,T.t-.1);const b=$('#tbar');
    if(b){b.style.width=(T.t/15*100)+'%';b.style.background=T.t<5?'var(--red)':T.t<9?'var(--mustard)':'var(--olive)'}
    if(T.t<=0){clearTimers();A.ans({k:-1})}
  },100));
}
function startClock(st,onEnd){
  const tick=()=>{const left=Math.max(0,Math.ceil(st.seconds-(Date.now()-st.start)/1000));const el=$('#clk');if(el)el.textContent=fmt(left);if(left<=0){clearTimers();onEnd()}};
  tick();timers.push(setInterval(tick,250));
}
async function endByClock(kind){
  const st=kind==='twenty'?S.W:kind==='scramble'?S.SD:S.WU;
  for(let n=0;n<4;n++){
    const r=await api('finish',{pid:S.pid,gid:S.cur.id});
    if(r.ok){st.stage='end';st.pts=r.pts;st.secret=r.secret;if(kind==='scramble')st.ok=st.ok||0;boop();await sync();render();return}
    await sleep(1200);
  }
  st.stage='end';st.pts=0;render();
}

  if(S.rmAsk!=='all'){S.rmAsk='all';render();return}
  S.rmAsk=null;const r=await HOST('hClearPlayers');if(!r.ok){toast(r.error);return}toast('All players removed');await refreshHost();sync();
},
resetAsk(){S.resetAsk=true;render()},
resetNo(){S.resetAsk=false;render()},
async resetYes(){const r=await HOST('hReset');if(!r.ok){toast(r.error);return}S.resetAsk=false;S.chat=[];S.chatTs=0;toast('Scores and games reset');await refreshHost();sync()}
};
function sdResult(r,skip){
  const D=S.SD;
  if(r.expired){D.stage='end';D.pts=r.pts;boop();sync().then(render);return}
  if(r.correct){D.ok=r.okCount;gobble();toast('Yes! +50')}else if(!skip){boop();toast('Not quite. Try again or skip.')}
  if(r.done){D.stage='end';D.ok=r.okCount;D.pts=r.pts;if(D.ok>=3){confetti(false)}sync().then(render);render();return}
  if(r.correct||skip)D.i=r.i;
  render();
}
async function refreshHost(){
  const r=await HOST('hState',{pid:S.pid});
  if(!r.ok){if(/PIN/.test(r.error)){S.unlocked=false;S.pin=''}toast(r.error);if(S.view==='admin')render();return}
  S.hs=r;if(S.view==='admin')render();
}
function stashForm(){const v=id=>{const e=$('#'+id);return e?e.value:undefined};['title','emoji','blurb'].forEach(k=>{const x=v('g'+k[0].toUpperCase()+k.slice(1));if(x!==undefined)S.ng[k]=x})}
function buildGame(){
  const v=id=>(($('#'+id)||{}).value||'').trim(),type=S.ng.type,body=v('gBody'),L=body.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let cfg;
  if(type==='trivia'||type==='race')cfg={questions:L.map(l=>{const p=l.split('|').map(x=>x.trim());return{q:p[0],a:p.slice(1,5)}})};
  else if(type==='vote')cfg={prompts:L};
  else if(type==='twenty')cfg={secret:v('gSecret'),choices:v('gChoices').split(/[,\n]/).map(x=>x.trim()).filter(Boolean),qa:L.map(l=>{const p=l.split('|');return{q:(p[0]||'').trim(),a:/^\s*y/i.test(p[1]||'')?'Yes':'No'}}),seconds:+v('gSecs')||150};
  else if(type==='scramble')cfg={words:L.map(l=>{const p=l.split('|');return{w:(p[0]||'').trim(),hint:(p[1]||'').trim()}}),seconds:+v('gSecs')||60};
  else if(type==='warm')cfg={secret:v('gSecret'),words:body.split(/[,\n]/).map(x=>x.trim()).filter(Boolean),seconds:+v('gSecs')||150};
  else if(type==='picks')cfg={matches:L.map(l=>{const m=l.split(/\s+vs\.?\s+/i);return{a:(m[0]||'').trim(),b:(m[1]||'').trim()}})};
  const title=v('gTitle');if(!title)return 'Give the game a title.';
  return{day:S.ng.day,type,title,emoji:v('gEmoji')||EMO[type],blurb:v('gBlurb'),cfg};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;ac();
  const f=A[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('change',e=>{if(e.target.id==='gType')A.ngType()});
document.addEventListener('input',e=>{if(e.target.id==='nm'){const pv=$('#pv');if(pv)pv.outerHTML=previewHtml(e.target.value.trim())}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='sdin')A.sdGo();
  if(e.target.id==='wuin')A.wuGo();
  if(e.target.id==='cin')A.send();
});

/* ---------- Boot ---------- */
(async function boot(){
  if(DEMO){startDemo();$('#draftbar').hidden=false}
  else if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  render();
  if(location.hash==='#tv'){go('tv');sync();schedule();return}
  if(S.pid){
    const r=await api('sync',{pid:S.pid,since:0});
    if(r.ok&&r.state.me){S.st=r.state;onChat(r.chat);go('home');schedule();return}
    if(r.net){toast(r.error)}
    S.pid=null;ls.set('ggg_pid','');
  }
  go('join',{jstep:S.code?'profile':'code'});
})();
</script>
